# =============================================================================
# VoiceOS — Development Profile Overrides
# =============================================================================
# Active when: SPRING_PROFILES_ACTIVE=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      # Spring AI OpenAI autoconfig refuses to start with a blank key.
      # Dev uses MockLLMProvider (voiceos.ai.mock=true). This placeholder is
      # not a real Groq/OpenAI credential and is not used for calculator.
      api-key: ${GROQ_API_KEY:local-dev-placeholder-not-a-real-key}
      chat:
        enabled: false
      embedding:
        enabled: false
      image:
        enabled: false
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      moderation:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration

voiceos:
  ai:
    mock: true     # Use mock AI responses in dev to save API quota
  # JWT_SECRET and VAPI_WEBHOOK_SECRET must still be set in the environment.
  # This profile does not inject fallback secrets. For local webhook testing
  # without Vapi, set VAPI_WEBHOOK_ALLOW_INSECURE_LOCAL=true explicitly.

logging:
  level:
    com.voiceos: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
