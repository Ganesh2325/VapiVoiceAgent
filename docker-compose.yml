version: '3.9'

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: voiceos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceos}
      POSTGRES_USER: ${POSTGRES_USER:-voiceos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceos_dev_password}
    ports:
      - "5433:5432"   # Using 5433 to avoid conflict with other local PostgreSQL instances
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceos} -d ${POSTGRES_DB:-voiceos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceos-network

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voiceos-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-voiceos_redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-voiceos_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceos-network

  # ─── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voiceos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-voiceos_qdrant_key}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - voiceos-network


  # ─── VoiceOS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./voiceos-backend
      dockerfile: Dockerfile
    container_name: voiceos-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - voiceos-network
    profiles:
      - full  # Only start backend via 'docker compose --profile full up'

  # ─── VoiceOS Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./voiceos-frontend
      dockerfile: Dockerfile
    container_name: voiceos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voiceos-network
    profiles:
      - full  # Only start frontend via 'docker compose --profile full up'

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  voiceos-network:
    driver: bridge
